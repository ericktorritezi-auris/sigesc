<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGESC — Pesquisas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0D1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIGESC">
</head>
<body data-app-version="1.0">
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">✕</button>
      <div class="brand">
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none"><circle cx="20" cy="20" r="19" stroke="#00B4A6" stroke-width="2.2"/><path d="M9 22 L14 22 L16.5 17 L19 26 L21.5 19 L24 22 L31 22" stroke="#00B4A6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-text">SIGESC</span>
      </div>
      <div class="side-role">
        <div class="name" id="side-role-name">—</div>
        <span class="tag-role" id="side-role-tag">—</span>
      </div>
      <div class="side-nav">
        <a href="/app/index.html">📊 Dashboard</a>
        <button class="active">📋 Pesquisas</button>
        <a href="/app/respostas.html">💬 Respostas</a>
        <a href="/app/lgpd.html">🛡️ LGPD</a>
        <a href="/app/empresas.html">🏢 Empresas</a>
        <a href="/app/usuarios.html">👥 Usuários</a>
        <div class="side-nav-grupo">
          <button class="side-nav-toggle" id="toggle-relatorios">📈 Análises <span class="chev">▾</span></button>
          <div class="side-nav-sub" id="sub-relatorios">
            <a href="/app/relatorios.html?view=cliente">Por Cliente</a>
            <a href="/app/relatorios.html?view=indicador">Por Dimensão</a>
            <a href="/app/relatorios.html?view=respostas">Por Respostas</a>
          </div>
        </div>
        <a href="/app/configuracoes.html">⚙️ Configurações</a>
      </div>
      <div class="side-foot">
        <a href="/app/perfil.html">👤 Meu Perfil</a>
        <button id="btn-logout">↩ Sair</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <h2>Pesquisas</h2>
            <div class="sub">Todas as pesquisas da sua carteira</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline-dark btn-exportar-leads-web" id="btn-exportar-leads" style="padding:9px 16px;font-size:13px;">⬇ Exportar Leads (Excel)</button>
          <button class="btn btn-primary" id="btn-nova-pesquisa" style="padding:9px 16px;font-size:13px;">+ Criar pesquisa</button>
        </div>
      </div>

      <div class="content">
        <div id="msg-area"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Título</th><th>Empresa</th><th>Ciclo</th><th>Status</th><th>Clientes</th><th>Respostas</th><th></th></tr>
            </thead>
            <tbody id="pesquisas-rows">
              <tr><td colspan="7" class="table-empty">Carregando...</td></tr>
            </tbody>
          </table>
          <div class="pagination">
            <span id="pag-label"></span>
            <div class="page-btns" id="pag-btns"></div>
          </div>
        </div>

        <div id="app-footer"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-duplicar">
    <div class="panel" style="max-width:440px;">
      <div class="panel-head"><h3 style="font-size:16px;">Duplicar pesquisa</h3><button class="panel-close" onclick="fecharModalDuplicar()">✕</button></div>
      <div class="panel-body">
        <input type="hidden" id="dup-pesquisa-id">
        <div class="field"><label>Empresa de destino</label>
          <select id="dup-empresa"></select>
        </div>
        <div class="field">
          <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-weight:400;">
            <input type="checkbox" id="dup-mesmo-ciclo" checked style="margin-top:3px;width:auto;">
            <span><strong>Vincular ao mesmo Ciclo</strong> da pesquisa original — os resultados das duas entram consolidados juntos no mesmo indicador. Desmarque para criar um Ciclo novo e independente.</span>
          </label>
        </div>
        <button class="btn btn-primary btn-block" id="btn-confirmar-duplicar" style="margin-top:8px;">Duplicar pesquisa</button>
      </div>
    </div>
  </div>

<style>
  /* Exportar leads é recurso de tela grande (baixa um arquivo Excel pra
     análise/uso fora do sistema) — mesmo padrão já usado nos botões de
     PDF/Modo Apresentação, escondido no mobile. */
  @media(max-width:900px){.btn-exportar-leads-web{display:none !important;}}
  .alert-box{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;}
  .alert-error{background:#FEE2E2;color:#B91C1C;}
  .alert-success{background:#DCFCE7;color:#15803D;}
  .overlay{position:fixed;inset:0;background:rgba(13,27,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.active{display:flex;}
  .panel{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
  .panel-head{padding:20px 24px;border-bottom:1px solid #EEF2F7;display:flex;justify-content:space-between;align-items:center;}
  .panel-body{padding:20px 24px;}
  .panel-close{width:30px;height:30px;border-radius:8px;background:var(--cinza-claro);color:var(--cinza-medio);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--cinza-escuro);margin-bottom:6px;}
  .field select{width:100%;padding:10px 12px;border:1.5px solid #E2E8F0;border-radius:9px;font-family:inherit;font-size:13px;}
  .field span{font-size:12.5px;font-weight:500;color:var(--cinza-escuro);line-height:1.5;}
</style>

  <script src="/js/footer.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    if (typeof inserirRodape === 'function') { inserirRodape('app-footer', false); }

    const token = localStorage.getItem('sigesc_token');
    if (!token) { window.location.href = '/login.html'; }

    let paginaAtual = 1;

    async function apiFetch(path, options = {}) {
      const resp = await fetch(path, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
          ...(options.headers || {}),
        },
      });
      if (resp.status === 401) {
        localStorage.removeItem('sigesc_token');
        window.location.href = '/login.html';
        throw new Error('Sessão expirada');
      }
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.erro || 'Erro na requisição');
      return data;
    }

    function mostrarMensagem(texto, tipo) {
      const area = document.getElementById('msg-area');
      area.innerHTML = `<div class="alert-box alert-${tipo}">${texto}</div>`;
      setTimeout(() => { area.innerHTML = ''; }, 5000);
    }

    function badgeStatus(status) {
      const map = { ativa: ['Ativa', 'status-ativa'], rascunho: ['Rascunho', 'status-rascunho'], inativa: ['Inativa', 'status-inativa'], encerrada: ['Encerrada', 'status-encerrada'] };
      const [label, cls] = map[status] || [status, 'status-rascunho'];
      return `<span class="status-pill ${cls}">${label}</span>`;
    }

    async function carregarPesquisas(pagina = 1) {
      paginaAtual = pagina;
      try {
        const data = await apiFetch(`/api/pesquisas?page=${pagina}&limit=20`);
        renderTabela(data);
      } catch (err) {
        mostrarMensagem('Erro ao carregar pesquisas: ' + err.message, 'error');
      }
    }

    function renderTabela(data) {
      const tbody = document.getElementById('pesquisas-rows');
      if (data.pesquisas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="table-empty">Nenhuma pesquisa criada ainda.<br>Clique em "+ Criar pesquisa" para começar.</td></tr>`;
      } else {
        tbody.innerHTML = data.pesquisas.map(p => `
          <tr>
            <td class="col-titulo">${p.titulo}</td>
            <td data-label="Empresa" class="col-empresa">${p.empresa_nome}</td>
            <td data-label="Ciclo" class="col-ciclo">${p.ciclo_titulo}</td>
            <td data-label="Status">${badgeStatus(p.status)}</td>
            <td data-label="Clientes" class="col-num">${p.total_clientes}</td>
            <td data-label="Respostas" class="col-num">${p.total_respostas}</td>
            <td class="row-actions">
              <button onclick="location.href='/app/pesquisa-wizard.html?id=${p.id}'">Editar</button>
              <button onclick="duplicarPesquisa('${p.id}')">Duplicar</button>
            </td>
          </tr>
        `).join('');
      }

      document.getElementById('pag-label').textContent = `Mostrando ${data.pesquisas.length} de ${data.total}`;
      const btns = document.getElementById('pag-btns');
      btns.innerHTML = '';
      for (let i = 1; i <= data.totalPaginas; i++) {
        const b = document.createElement('button');
        b.textContent = i;
        if (i === data.page) b.classList.add('active');
        b.onclick = () => carregarPesquisas(i);
        btns.appendChild(b);
      }
    }

    async function duplicarPesquisa(pesquisaId) {
      try {
        const { empresas } = await apiFetch('/api/empresas');
        const ativas = empresas.filter(e => e.ativa); // não pode duplicar pra empresa inativa
        document.getElementById('dup-pesquisa-id').value = pesquisaId;
        document.getElementById('dup-empresa').innerHTML = ativas.map(e => `<option value="${e.id}">${e.nome}</option>`).join('');
        document.getElementById('dup-mesmo-ciclo').checked = true;
        document.getElementById('modal-duplicar').classList.add('active');
      } catch (err) {
        mostrarMensagem('Erro ao carregar empresas: ' + err.message, 'error');
      }
    }
    function fecharModalDuplicar() { document.getElementById('modal-duplicar').classList.remove('active'); }

    document.getElementById('btn-confirmar-duplicar').addEventListener('click', async () => {
      const pesquisaId = document.getElementById('dup-pesquisa-id').value;
      const empresaId = document.getElementById('dup-empresa').value;
      const mesmoCiclo = document.getElementById('dup-mesmo-ciclo').checked;
      try {
        await apiFetch(`/api/pesquisas/${pesquisaId}/duplicar`, {
          method: 'POST',
          body: JSON.stringify({ empresaId, mesmoCiclo }),
        });
        fecharModalDuplicar();
        mostrarMensagem('Pesquisa duplicada com sucesso!', 'success');
        carregarPesquisas(paginaAtual);
      } catch (err) {
        mostrarMensagem('Erro ao duplicar: ' + err.message, 'error');
      }
    });

    document.getElementById('btn-nova-pesquisa').addEventListener('click', () => {
      window.location.href = '/app/pesquisa-wizard.html';
    });

    document.getElementById('btn-exportar-leads').addEventListener('click', async () => {
      const btn = document.getElementById('btn-exportar-leads');
      const textoOriginal = btn.textContent;
      btn.textContent = 'Gerando...';
      btn.disabled = true;
      try {
        const resp = await fetch('/api/pesquisas/exportar-respondentes', { headers: { Authorization: 'Bearer ' + token } });
        if (!resp.ok) throw new Error('Falha ao gerar o Excel.');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sigesc-leads-respondentes.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        mostrarMensagem('Erro ao exportar leads: ' + err.message, 'error');
      } finally {
        btn.textContent = textoOriginal;
        btn.disabled = false;
      }
    });

    (async () => {
      try {
        const resp = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!resp.ok) { localStorage.removeItem('sigesc_token'); window.location.href = '/login.html'; return; }
        const data = await resp.json();
        document.getElementById('side-role-name').textContent = data.usuario.nome;
        if (data.usuario.perfil === 'administrador') { window.location.href = '/app/admin.html'; return; }
        document.getElementById('side-role-tag').textContent = data.usuario.perfil === 'gestor' ? 'Gestor' : 'Usuário';
      } catch (err) {
        window.location.href = '/login.html';
      }
      carregarPesquisas(1);
    })();

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('sigesc_token');
      window.location.href = '/login.html';
    });

    const toggleBtnRelatorios = document.getElementById('toggle-relatorios');
    const subMenuRelatorios = document.getElementById('sub-relatorios');
    if (toggleBtnRelatorios) {
      toggleBtnRelatorios.addEventListener('click', () => { toggleBtnRelatorios.classList.toggle('aberto'); subMenuRelatorios.classList.toggle('aberto'); });
    }

    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('menu-toggle').addEventListener('click', () => { sidebar.classList.add('open'); backdrop.classList.add('open'); });
    document.getElementById('sidebar-close').addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
    backdrop.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
    window.addEventListener('resize', () => { if (window.innerWidth > 900) { sidebar.classList.remove('open'); backdrop.classList.remove('open'); } });
  </script>
</body>
</html>
