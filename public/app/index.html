<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGESC — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

<!-- PWA / Favicon -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167x167.png">
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGESC">
</head>
<body data-app-version="1.0">
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">✕</button>
      <div class="brand">
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none"><circle cx="20" cy="20" r="19" stroke="#00B4A6" stroke-width="2.2"/><path d="M9 22 L14 22 L16.5 17 L19 26 L21.5 19 L24 22 L31 22" stroke="#00B4A6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-text">SIGESC</span>
      </div>
      <div class="side-role">
        <div class="name" id="side-role-name">—</div>
        <span class="tag-role" id="side-role-tag">—</span>
      </div>
      <div class="side-nav">
        <button class="active">📊 Dashboard</button>
        <a href="/app/pesquisas.html">📋 Pesquisas</a>
        <button disabled title="Disponível no Sprint 3" style="opacity:.4;cursor:not-allowed;">💬 Respostas</button>
        <button disabled title="Disponível no Sprint 6" style="opacity:.4;cursor:not-allowed;">🛡️ LGPD</button>
        <button disabled title="Disponível no Sprint 6" style="opacity:.4;cursor:not-allowed;">👥 Usuários</button>
        <button disabled title="Disponível no Sprint 6" style="opacity:.4;cursor:not-allowed;">⚙️ Configurações</button>
      </div>
      <div class="side-foot">
        <button id="btn-logout">↩ Sair</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <h2>Dashboard</h2>
            <div class="sub">Sprint 1 — fundação do sistema</div>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="empty-state">
          <div class="icon">📊</div>
          <h3>Login funcionando — bem-vindo(a), <span id="nome-usuario">...</span>!</h3>
          <p>Os dados de pesquisas, respostas e indicadores entram nas próximas sprints. Esta tela confirma que a autenticação, o banco de dados e a sessão estão funcionando de ponta a ponta.</p>
        </div>
        <div id="app-footer"></div>
      </div>
    </div>
  </div>

  <script src="/js/footer.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    // Blindagem: se o footer.js (utilitário externo) falhar ao carregar por qualquer motivo
    // (rede instável, etc), isso NÃO pode travar o restante do script — sessão e menu
    // sanduíche têm que continuar funcionando independente disso.
    if (typeof inserirRodape === 'function') {
      inserirRodape('app-footer', false);
    }

    const token = localStorage.getItem('sigesc_token');
    if (!token) {
      window.location.href = '/login.html';
    }

    // Valida a sessão de verdade contra a API (não confia só no que está no localStorage).
    (async () => {
      try {
        const resp = await fetch('/api/auth/me', {
          headers: { Authorization: 'Bearer ' + token },
        });
        if (!resp.ok) {
          localStorage.removeItem('sigesc_token');
          localStorage.removeItem('sigesc_usuario');
          window.location.href = '/login.html';
          return;
        }
        const data = await resp.json();
        const usuario = data.usuario;

        document.getElementById('side-role-name').textContent = usuario.nome;
        document.getElementById('side-role-tag').textContent = usuario.perfil === 'gestor' ? 'Gestor' : 'Usuário';
        document.getElementById('nome-usuario').textContent = usuario.nome;
      } catch (err) {
        localStorage.removeItem('sigesc_token');
        window.location.href = '/login.html';
      }
    })();

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('sigesc_token');
      localStorage.removeItem('sigesc_usuario');
      window.location.href = '/login.html';
    });

    // ---------- Menu sanduíche (mobile): sobrepõe a tela, não empurra o conteúdo ----------
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    const menuToggle = document.getElementById('menu-toggle');
    const sidebarClose = document.getElementById('sidebar-close');

    function abrirMenu() {
      sidebar.classList.add('open');
      backdrop.classList.add('open');
    }
    function fecharMenu() {
      sidebar.classList.remove('open');
      backdrop.classList.remove('open');
    }

    menuToggle.addEventListener('click', abrirMenu);
    sidebarClose.addEventListener('click', fecharMenu);
    backdrop.addEventListener('click', fecharMenu);

    // Se a pessoa girar o celular pra paisagem/desktop, o menu fecha sozinho
    // (evita ficar "aberto" preso quando a sidebar já é fixa na tela grande).
    window.addEventListener('resize', () => {
      if (window.innerWidth > 900) fecharMenu();
    });
  </script>
</body>
</html>
