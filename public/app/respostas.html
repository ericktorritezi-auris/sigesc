<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGESC — Respostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0D1B2A">
</head>
<body data-app-version="1.0">
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">✕</button>
      <div class="brand">
        <svg viewBox="0 0 40 40" width="26" height="26" fill="none"><circle cx="20" cy="20" r="19" stroke="#00B4A6" stroke-width="2.2"/><path d="M9 22 L14 22 L16.5 17 L19 26 L21.5 19 L24 22 L31 22" stroke="#00B4A6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-text">SIGESC</span>
      </div>
      <div class="side-role"><div class="name" id="side-role-name">—</div><span class="tag-role" id="side-role-tag">—</span></div>
      <div class="side-nav">
        <a href="/app/index.html">📊 Dashboard</a>
        <a href="/app/pesquisas.html">📋 Pesquisas</a>
        <button class="active">💬 Respostas</button>
        <a href="/app/lgpd.html">🛡️ LGPD</a>
        <a href="/app/usuarios.html">👥 Usuários</a>
        <a href="/app/configuracoes.html">⚙️ Configurações</a>
      </div>
      <div class="side-foot"><button id="btn-logout">↩ Sair</button></div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div><h2>Respostas</h2><div class="sub">Todas as respostas recebidas pela sua carteira</div></div>
        </div>
      </div>

      <div class="content">
        <div id="msg-area"></div>
        <div class="toolbar">
          <input type="date" id="filtro-de" style="padding:9px 12px;border:1.5px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:13px;">
          <input type="date" id="filtro-ate" style="padding:9px 12px;border:1.5px solid #E2E8F0;border-radius:10px;font-family:inherit;font-size:13px;">
          <button class="btn btn-outline-dark" id="btn-filtrar" style="padding:9px 16px;font-size:13px;">Filtrar</button>
          <button class="btn btn-outline-dark" id="btn-limpar" style="padding:9px 16px;font-size:13px;">Limpar</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Cliente</th><th>Empresa</th><th>Pesquisa</th><th>Score</th><th>Recebida em</th></tr></thead>
            <tbody id="rows"><tr><td colspan="5" class="table-empty">Carregando...</td></tr></tbody>
          </table>
          <div class="pagination"><span id="pag-label"></span><div class="page-btns" id="pag-btns"></div></div>
        </div>
        <div id="app-footer"></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="modal-detalhe">
    <div class="panel">
      <div class="panel-head">
        <div><h3 id="detalhe-titulo" style="font-size:16px;">Resposta</h3><div class="sub" id="detalhe-sub" style="font-size:12px;color:var(--cinza-medio);margin-top:3px;"></div></div>
        <button class="panel-close" onclick="fecharModal()">✕</button>
      </div>
      <div class="panel-body" id="detalhe-body"></div>
    </div>
  </div>

<style>
  .overlay{position:fixed;inset:0;background:rgba(13,27,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .overlay.active{display:flex;}
  .panel{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
  .panel-head{padding:20px 24px;border-bottom:1px solid #EEF2F7;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .panel-body{padding:20px 24px;}
  .panel-close{width:30px;height:30px;border-radius:8px;background:var(--cinza-claro);color:var(--cinza-medio);flex-shrink:0;}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;}
  .badge-excelente{background:#DCFCE7;color:#15803D;}
  .badge-saudavel{background:#DBEAFE;color:#1D4ED8;}
  .badge-atencao{background:#FEF3C7;color:#B45309;}
  .badge-critico{background:#FEE2E2;color:#B91C1C;}
  .score-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .score-mini{background:var(--cinza-claro);border-radius:10px;padding:12px;text-align:center;}
  .score-mini .v{font-size:18px;font-weight:800;}
  .score-mini .l{font-size:10px;color:var(--cinza-medio);font-weight:600;}
  .block-section{margin-bottom:16px;}
  .block-section h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--cinza-medio);margin-bottom:8px;}
  .ans-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;gap:14px;}
  .ans-row .a-val{font-weight:700;color:var(--azul-inteligente);white-space:nowrap;}
  .ans-row.vazio .a-val{color:var(--cinza-medio);font-weight:500;font-style:italic;}
  .open-ans{background:var(--cinza-claro);border-radius:10px;padding:10px 12px;font-size:12.5px;font-style:italic;margin-top:5px;}
  .alert-box{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;}
  .alert-error{background:#FEE2E2;color:#B91C1C;}
</style>

  <script src="/js/footer.js"></script>
  <script src="/js/pwa.js"></script>
  <script>
    if (typeof inserirRodape === 'function') { inserirRodape('app-footer', false); }
    const token = localStorage.getItem('sigesc_token');
    if (!token) { window.location.href = '/login.html'; }
    let paginaAtual = 1;

    async function apiFetch(path, options = {}) {
      const resp = await fetch(path, { ...options, headers: { Authorization: 'Bearer ' + token, ...(options.headers || {}) } });
      if (resp.status === 401) { localStorage.removeItem('sigesc_token'); window.location.href = '/login.html'; throw new Error('Sessão expirada'); }
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.erro || 'Erro na requisição');
      return data;
    }
    function mostrarMensagem(texto, tipo) {
      document.getElementById('msg-area').innerHTML = `<div class="alert-box alert-${tipo}">${texto}</div>`;
    }
    function badgeFaixa(v) {
      v = Number(v);
      if (v >= 8.5) return '<span class="badge badge-excelente">Excelente</span>';
      if (v >= 7) return '<span class="badge badge-saudavel">Saudável</span>';
      if (v >= 5) return '<span class="badge badge-atencao">Atenção</span>';
      return '<span class="badge badge-critico">Crítico</span>';
    }

    async function carregar(pagina = 1) {
      paginaAtual = pagina;
      const de = document.getElementById('filtro-de').value;
      const ate = document.getElementById('filtro-ate').value;
      let url = `/api/respostas?page=${pagina}&limit=20`;
      if (de) url += `&de=${de}`;
      if (ate) url += `&ate=${ate}`;
      try {
        const data = await apiFetch(url);
        renderTabela(data);
      } catch (err) { mostrarMensagem('Erro: ' + err.message, 'error'); }
    }

    function renderTabela(data) {
      const tbody = document.getElementById('rows');
      if (data.respostas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="table-empty">Nenhuma resposta encontrada.</td></tr>`;
      } else {
        tbody.innerHTML = data.respostas.map(r => `
          <tr onclick="abrirDetalhe('${r.id}')" style="cursor:pointer;">
            <td class="col-titulo">${r.nome_cliente}</td>
            <td data-label="Empresa">${r.empresa_nome}</td>
            <td data-label="Pesquisa">${r.pesquisa_titulo}</td>
            <td data-label="Score">${r.score_geral ? Number(r.score_geral).toFixed(1).replace('.', ',') + ' ' + badgeFaixa(r.score_geral) : '—'}</td>
            <td data-label="Recebida em">${new Date(r.respondido_em).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'short' })}</td>
          </tr>
        `).join('');
      }
      document.getElementById('pag-label').textContent = `Mostrando ${data.respostas.length} de ${data.total}`;
      const btns = document.getElementById('pag-btns');
      btns.innerHTML = '';
      for (let i = 1; i <= data.totalPaginas; i++) {
        const b = document.createElement('button');
        b.textContent = i;
        if (i === data.page) b.classList.add('active');
        b.onclick = () => carregar(i);
        btns.appendChild(b);
      }
    }

    function qTypeVal(p) {
      if (p.valor_numerico !== null && p.valor_numerico !== undefined) return `<span class="a-val">${p.valor_numerico}</span>`;
      if (p.valor_texto) return null; // tratado separadamente (texto longo)
      return '<span class="a-val">—</span>';
    }

    async function abrirDetalhe(id) {
      try {
        const { resposta } = await apiFetch(`/api/respostas/${id}`);
        document.getElementById('detalhe-titulo').textContent = resposta.nome_cliente + ' · ' + resposta.empresa_nome;
        document.getElementById('detalhe-sub').textContent = 'Recebida em ' + new Date(resposta.respondido_em).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + ' (horário de Brasília)';

        let html = `<div class="score-mini-grid">
          <div class="score-mini"><div class="v" style="color:#2563EB;">${resposta.isa ?? '—'}</div><div class="l">ISA</div></div>
          <div class="score-mini"><div class="v" style="color:#00B4A6;">${resposta.ise ?? '—'}</div><div class="l">ISE</div></div>
          <div class="score-mini"><div class="v" style="color:#F59E0B;">${resposta.ist ?? '—'}</div><div class="l">IST</div></div>
          <div class="score-mini"><div class="v" style="color:#22C55E;">${resposta.isv ?? '—'}</div><div class="l">ISV</div></div>
        </div>`;

        const labelBloco = { orientacoes: 'Orientações', identificacao: 'Identificação', atendimento: 'Atendimento', infraestrutura: 'Infraestrutura', tecnologia: 'Tecnologia', valor_percebido: 'Valor Percebido', comentarios: 'Comentários' };

        resposta.blocos.forEach(b => {
          if (b.tipo_bloco === 'orientacoes') return; // consentimento já é mostrado no LGPD
          html += `<div class="block-section"><h4>${labelBloco[b.tipo_bloco] || b.tipo_bloco}</h4>`;

          // Nome, E-mail e Cargo são campos dedicados da própria resposta (não
          // ficam em respostas_itens) — mostrados aqui com o valor real, em
          // vez de cair no loop genérico abaixo (que os veria como "não respondidos").
          if (b.tipo_bloco === 'identificacao') {
            html += `<div class="ans-row"><span>Nome completo</span><span class="a-val">${resposta.nome_completo}</span></div>`;
            html += `<div class="ans-row"><span>E-mail</span><span class="a-val">${resposta.email}</span></div>`;
            html += `<div class="ans-row"><span>Cargo</span><span class="a-val">${resposta.cargo}</span></div>`;
          }

          b.perguntas.forEach(p => {
            if (p.tipo === 'nome' || p.tipo === 'email' || p.tipo === 'selecao_cliente') return; // já mostrados acima/no cabeçalho
            if (b.tipo_bloco === 'identificacao' && p.tipo === 'texto_livre') return; // é o Cargo, já mostrado acima
            if (p.tipo === 'texto_livre') {
              html += `<div style="margin-bottom:8px;"><span style="font-size:12.5px;color:var(--cinza-escuro);">${p.texto}</span>
                <div class="open-ans">${p.valor_texto ? '"' + p.valor_texto + '"' : '<span style="color:var(--cinza-medio);">Não respondida</span>'}</div></div>`;
            } else {
              const valor = qTypeVal(p) || `<span class="a-val">${p.valor_texto || '—'}</span>`;
              html += `<div class="ans-row ${!p.valor_numerico && !p.valor_texto ? 'vazio' : ''}"><span>${p.texto}</span>${valor}</div>`;
            }
          });
          html += `</div>`;
        });

        document.getElementById('detalhe-body').innerHTML = html;
        document.getElementById('modal-detalhe').classList.add('active');
      } catch (err) {
        mostrarMensagem('Erro ao carregar detalhe: ' + err.message, 'error');
      }
    }
    function fecharModal() { document.getElementById('modal-detalhe').classList.remove('active'); }

    document.getElementById('btn-filtrar').addEventListener('click', () => carregar(1));
    document.getElementById('btn-limpar').addEventListener('click', () => {
      document.getElementById('filtro-de').value = '';
      document.getElementById('filtro-ate').value = '';
      carregar(1);
    });

    (async () => {
      try {
        const resp = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!resp.ok) { localStorage.removeItem('sigesc_token'); window.location.href = '/login.html'; return; }
        const data = await resp.json();
        if (data.usuario.perfil === 'administrador') { window.location.href = '/app/admin.html'; return; }
        document.getElementById('side-role-name').textContent = data.usuario.nome;
        document.getElementById('side-role-tag').textContent = data.usuario.perfil === 'gestor' ? 'Gestor' : 'Usuário';
      } catch (err) { window.location.href = '/login.html'; return; }
      carregar(1);
    })();

    document.getElementById('btn-logout').addEventListener('click', () => { localStorage.removeItem('sigesc_token'); window.location.href = '/login.html'; });
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    document.getElementById('menu-toggle').addEventListener('click', () => { sidebar.classList.add('open'); backdrop.classList.add('open'); });
    document.getElementById('sidebar-close').addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
    backdrop.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); });
    window.addEventListener('resize', () => { if (window.innerWidth > 900) { sidebar.classList.remove('open'); backdrop.classList.remove('open'); } });
  </script>
</body>
</html>
